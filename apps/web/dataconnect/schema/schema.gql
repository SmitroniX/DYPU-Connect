type Student @table(key: "studentId") @auth(
  level: USER,
  read: { any: true }
) {
  studentId: String!
  firstName: String!
  lastName: String!
  email: String!
  department: String!
  program: String!
  yearOfStudy: Int!
  createdAt: Timestamp!
  bio: String
  profilePictureUrl: String
  blurHash: String
  contactNumber: String
}

type Group @table(key: "name") @auth(
  level: USER,
  read: { any: true },
  create: { where: { adminStudentId: { studentId: { eq: "auth.uid" } } } }
) {
  name: String!
  description: String!
  groupType: String!
  createdAt: Timestamp!
  adminStudentId: Student!
  coverImageUrl: String
}

type Membership @table(key: ["student", "group"]) @auth(
  level: USER,
  read: { any: true },
  create: { where: { student: { studentId: { eq: "auth.uid" } } } },
  delete: { where: { student: { studentId: { eq: "auth.uid" } } } }
) {
  student: Student!
  group: Group!
  joinedAt: Timestamp!
}

type Post @table @auth(
  level: USER,
  read: { any: true },
  create: { where: { student: { studentId: { eq: "auth.uid" } } } },
  delete: { where: { student: { studentId: { eq: "auth.uid" } } } }
) {
  student: Student!
  content: String!
  createdAt: Timestamp!
  group: Group
  imageUrl: String
  blurHash: String
  documentUrl: String
}

type DirectMessage @table @auth(
  level: USER,
  read: { _or: [
    { sender: { studentId: { eq: "auth.uid" } } },
    { receiver: { studentId: { eq: "auth.uid" } } }
  ] },
  create: { where: { sender: { studentId: { eq: "auth.uid" } } } },
  update: { where: { sender: { studentId: { eq: "auth.uid" } } } },
  delete: { where: { sender: { studentId: { eq: "auth.uid" } } } }
) {
  sender: Student!
  receiver: Student!
  messageContent: String!
  sentAt: Timestamp! @default(expr: "request.time")
  imageUrl: String
  blurHash: String
  gifUrl: String
  audioUrl: String
  reactions: Any
  isEdited: Boolean @default(value: false)
  isDeleted: Boolean @default(value: false)
  replyTo: DirectMessage
}

type GroupMessage @table @auth(
  level: USER,
  read: { any: true }, # In a group, all members can read
  create: { where: { sender: { studentId: { eq: "auth.uid" } } } },
  update: { where: { sender: { studentId: { eq: "auth.uid" } } } },
  delete: { where: { sender: { studentId: { eq: "auth.uid" } } } }
) {
  sender: Student!
  group: Group!
  messageContent: String!
  sentAt: Timestamp! @default(expr: "request.time")
  imageUrl: String
  blurHash: String
  gifUrl: String
  audioUrl: String
  reactions: Any
  isEdited: Boolean @default(value: false)
  isDeleted: Boolean @default(value: false)
  replyTo: GroupMessage
}

type PublicMessage @table @auth(
  level: USER,
  read: { any: true },
  create: { where: { sender: { studentId: { eq: "auth.uid" } } } },
  update: { where: { sender: { studentId: { eq: "auth.uid" } } } },
  delete: { where: { sender: { studentId: { eq: "auth.uid" } } } }
) {
  sender: Student!
  messageContent: String!
  sentAt: Timestamp! @default(expr: "request.time")
  imageUrl: String
  blurHash: String
  gifUrl: String
  audioUrl: String
  reactions: Any
  isEdited: Boolean @default(value: false)
  isDeleted: Boolean @default(value: false)
  expiresAt: Timestamp!
}

type Comment @table @auth(
  level: USER,
  read: { any: true },
  create: { where: { student: { studentId: { eq: "auth.uid" } } } },
  delete: { where: { student: { studentId: { eq: "auth.uid" } } } }
) {
  student: Student!
  post: Post!
  commentContent: String!
  createdAt: Timestamp!
}